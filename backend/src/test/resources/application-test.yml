spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
jwt:
  secret: testSecretKeyForTestingOnly1234567890abcdef
  expiration: 86400000
gcs:
  project-id: test-project
  bucket-name: test-bucket
  emulator-host: ""
logging:
  level:
    root: WARN
    org.springframework: WARN
